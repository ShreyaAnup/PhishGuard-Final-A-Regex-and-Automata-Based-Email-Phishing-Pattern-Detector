<html lang="en">

  <style>
    :root {
      --pastel-pink: #ffd6e0;
      --pastel-pink-dark: #f7a8b8;
      --pastel-green: #c8e6c9;
      --pastel-green-dark: #81c784;
      --pastel-yellow: #fff9c4;
      --pastel-yellow-dark: #fff176;
      --pastel-purple: #e8dff5;
      --bg-cream: #faf7f2;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-light: #edf2f7;
      --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, var(--pastel-pink) 0%, var(--pastel-yellow) 50%, var(--pastel-green) 100%);
      padding: 50px 20px;
      text-align: center;
      border-bottom: 3px solid rgba(255,255,255,0.6);
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .header-content { max-width: 900px; margin: 0 auto; }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.85);
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 13px;
      color: #4a5568;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    h1 { font-size: 40px; font-weight: 800; color: #1a202c; margin-bottom: 8px; }
    .subtitle { font-size: 16px; color: #4a5568; max-width: 650px; margin: 0 auto; }

    .container { max-width: 1000px; margin: 40px auto 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 30px; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(0,0,0,0.03);
    }

    .card-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }

    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #4a5568; }
    
    textarea, input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-light);
      font-family: inherit;
      font-size: 15px;
      margin-bottom: 16px;
      transition: border-color 0.2s ease;
    }
    textarea { height: 110px; resize: vertical; }
    textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--pastel-pink-dark); }

    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .btn {
      padding: 12px 28px;
      border-radius: 50px;
      border: none;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
