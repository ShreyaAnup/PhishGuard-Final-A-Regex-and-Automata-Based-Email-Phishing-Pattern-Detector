<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard - Regex & Automata Phishing Detector</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    :root {
      --pastel-pink: #ffd6e0;
      --pastel-pink-dark: #f7a8b8;
      --pastel-blue: #d4f0f0;
      --pastel-blue-dark: #73c2fb;
      --pastel-purple: #e8dff5;
      --pastel-purple-dark: #b39ddb;
      --bg-cream: #f9f8fc;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-light: #edf2f7;
      --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, var(--pastel-pink) 0%, var(--pastel-blue) 50%, var(--pastel-purple) 100%);
      padding: 50px 20px;
      text-align: center;
      border-bottom: 3px solid rgba(255,255,255,0.6);
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .header-content { max-width: 900px; margin: 0 auto; }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.85);
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 13px;
      color: #4a5568;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    h1 { font-size: 40px; font-weight: 800; color: #1a202c; margin-bottom: 8px; }
    .subtitle { font-size: 16px; color: #4a5568; max-width: 650px; margin: 0 auto; }

    .container { max-width: 1000px; margin: 40px auto 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 30px; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(0,0,0,0.03);
    }

    .card-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }

    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #4a5568; }
    
    textarea, input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-light);
      font-family: inherit;
      font-size: 15px;
      margin-bottom: 16px;
      transition: border-color 0.2s ease;
    }
    textarea { height: 110px; resize: vertical; }
    textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--pastel-purple-dark); }

    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .btn {
      padding: 12px 28px;
      border-radius: 50px;
      border: none;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary { background: var(--pastel-pink-dark); color: #000; }
    .btn-primary:hover { background: #f48fb1; transform: translateY(-2px); }
    .btn-secondary { background: var(--pastel-blue); color: #2d3748; }
    .btn-secondary:hover { background: #bce8e8; transform: translateY(-2px); }
    .btn-purple { background: var(--pastel-purple-dark); color: #fff; }
    .btn-purple:hover { background: #9575cd; transform: translateY(-2px); }

    .sample-tag {
      background: var(--bg-cream);
      border: 1px solid var(--border-light);
      padding: 8px 14px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sample-tag:hover { background: var(--pastel-blue); }

    .score-banner { display: flex; align-items: center; justify-content: space-between; border-radius: var(--radius-md); padding: 24px; margin-bottom: 24px; }
    .score-banner.low { background: var(--pastel-blue); }
    .score-banner.medium { background: var(--pastel-purple); }
    .score-banner.high { background: var(--pastel-pink); }
    .score-val { font-size: 36px; font-weight: 800; }

    .pattern-item { padding: 16px; border-radius: var(--radius-md); background: var(--bg-cream); margin-bottom: 12px; border-left: 5px solid #cbd5e0; }
    .pattern-item.high { border-left-color: #f56565; }
    .pattern-item.medium { border-left-color: #b39ddb; }
    .pattern-item.low { border-left-color: #73c2fb; }

    .automaton-canvas { display: flex; justify-content: space-between; align-items: center; padding: 40px 20px; background: #fafafa; border-radius: var(--radius-md); margin: 20px 0; overflow-x: auto; }
    .state-node {
      width: 65px; height: 65px; border-radius: 50%; border: 3px solid #718096;
      display: flex; align-items: center; justify-content: center; font-weight: 800; background: #fff; position: relative; transition: all 0.3s ease;
    }
    .state-node.start::before { content: "▶"; position: absolute; left: -20px; color: #718096; }
    .state-node.final { box-shadow: 0 0 0 4px #fff, 0 0 0 7px #718096; }
    .state-node.active { background: var(--pastel-blue); border-color: #73c2fb; transform: scale(1.15); }
    .state-node.accept { background: var(--pastel-blue-dark); border-color: #3182ce; color: white; }
    .state-node.reject { background: var(--pastel-pink-dark); border-color: #e53e3e; color: white; }

    .transition-arrow { flex: 1; height: 2px; background: #cbd5e0; position: relative; margin: 0 10px; display: flex; align-items: center; justify-content: center; }
    .transition-arrow::after { content: "►"; position: absolute; right: -6px; color: #cbd5e0; font-size: 10px; }
    .transition-label { background: #fff; padding: 2px 8px; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; border: 1px solid #e2e8f0; margin-top: -20px; }

    .regex-card { border: 2px solid var(--border-light); border-radius: var(--radius-md); padding: 20px; margin-bottom: 16px; background: #fff; }
    .code-block { font-family: 'JetBrains Mono', monospace; background: #2d3748; color: #f7fafc; padding: 10px 14px; border-radius: 8px; font-size: 14px; display: inline-block; margin: 8px 0; }
    .regex101-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--pastel-purple); color: #2d3748; padding: 6px 14px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 12px; }

    .sandbox-box { background: var(--bg-cream); padding: 20px; border-radius: var(--radius-md); margin-top: 15px; border: 1px dashed #cbd5e0; }
